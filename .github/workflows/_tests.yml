name: Run tests
on:
  workflow_call

jobs:
  run_unit_tests:
    # Pinned: pyjq 2.6.0 has no wheel and its bundled oniguruma does not
    # compile with the gcc on ubuntu-26.04, which ubuntu-latest now means.
    runs-on: ubuntu-24.04
    services:
      # Scratch database for the patch store tests (app/actions/patches_store).
      # Same major version as the pipeline Cloud SQL instances.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gnw_patches_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      - name: Install pip
        run: python -m ensurepip --upgrade
      - name: Install pip tools
        # typing_extensions listed explicitly: pip-tools 7.6.0 imports it on
        # Python 3.10 without declaring it as a dependency
        run: pip install pip-tools typing_extensions
      - name: Install compile dependencies
        run: pip-compile --output-file=requirements.txt requirements-base.in requirements-dev.in requirements.in
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run unit tests
        env:
          GNW_PATCHES_TEST_DB_URL: postgresql://postgres:test@localhost:5432/gnw_patches_test
        run: pytest
